[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ppghr"
version = "0.1.0"
description = "Heart-rate estimation from finger PPG under motion (PhysioNet PTT-PPG dataset)"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
